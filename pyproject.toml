[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-platform"
version = "0.1.0"
description = "Local-first lakehouse: Medallion architecture, CDC, Delta Lake, dbt, governance, and applied LLM engineering on a synthetic retail-banking domain."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Lucas Luttazi" }]
dependencies = [
    # Spark 4.1 + Delta 4.3 are a verified pair: delta-spark 4.3.x requires
    # pyspark >=4.0.1,<=4.1.1. Java 21 rules out the Spark 3.5 line entirely.
    "pyspark[sql]==4.1.1",
    "delta-spark==4.3.1",
    "confluent-kafka~=2.15",
    "dbt-duckdb~=1.10.0",
    "duckdb~=1.4.0",
    "faker~=37.0",
    "pydantic~=2.13",
    "pyyaml~=6.0",
]

[project.optional-dependencies]
# sentence-transformers pulls torch (~2 GB); the RAG pipeline falls back to a
# deterministic hashing embedder when this extra is not installed.
rag-st = ["sentence-transformers>=3.0"]
dashboard = ["streamlit~=1.59"]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "ruff~=0.14.0",
    "mypy~=1.15",
    "types-pyyaml~=6.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "ingestion",
    "pipelines",
    "quality",
    "governance",
    "ai",
    "observability",
    "orchestration",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["pipelines/gold_scala"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PL"]
ignore = [
    "PLR2004", # magic values in tests/thresholds are fine
]

[tool.ruff.lint.pylint]
max-args = 7 # keyword-only builders (e.g. Debezium envelope) legitimately take 6+


[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.mypy]
python_version = "3.11"
strict = true
# PySpark's Column/Row APIs leak `Any` through arithmetic and UDF boundaries;
# warn_return_any would force pointless casts without catching real bugs.
warn_return_any = false
exclude = ["pipelines/gold_scala/"]

[[tool.mypy.overrides]]
module = ["delta.*", "confluent_kafka.*", "duckdb.*", "streamlit.*", "sentence_transformers.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: tests that start a local SparkSession (slow, JVM required)",
    "integration: end-to-end tests over generated data",
]
addopts = "-ra"
