# The strongest signal this repo can send: CI proves the README quickstart
# actually works, end to end, from a clean clone — small event volume, file
# transport, hashing embedder (the rag-st extra is never installed in CI).
name: demo-smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly: catch dependency/runtime rot
  workflow_dispatch:

jobs:
  demo:
    name: make demo (end-to-end, file transport)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.ivy2.5.2
            ~/.cache/coursier
            ~/.sbt
          key: demo-jvm-${{ runner.os }}-${{ hashFiles('pipelines/gold_scala/build.sbt') }}
      - run: uv sync --group dev
      - name: end-to-end demo
        run: make demo EVENTS=300
      - name: upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-run
          path: |
            data/run/**/logs/*.log
            data/reports/*.md
            data/reports/*.html
          if-no-files-found: ignore
